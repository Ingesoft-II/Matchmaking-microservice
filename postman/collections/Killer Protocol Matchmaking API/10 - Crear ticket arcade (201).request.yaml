$kind: http-request
url: "{{baseUrl}}/api/matchmaking/tickets/arcade"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{casualToken}}
body:
  type: text
  content: |-
    {
      "playerIds": ["{{casualPlayer}}"],
      "region": "sa-east",
      "latencyMs": 30
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('crear ticket: 201', () => pm.response.to.have.status(201));
      const b = pm.response.json(); pm.expect(b.id).to.be.a('string').and.not.empty; pm.expect(b.status).to.eql('WAITING'); pm.collectionVariables.set('ticketId', b.id);
    language: text/javascript
order: 10000
