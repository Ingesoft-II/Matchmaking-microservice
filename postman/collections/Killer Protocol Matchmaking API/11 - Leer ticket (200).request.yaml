$kind: http-request
url: "{{baseUrl}}/api/matchmaking/tickets/{{ticketId}}"
method: GET
headers:
  Authorization: Bearer {{casualToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('leer ticket: 200', () => pm.response.to.have.status(200));
      pm.test('mismo ticket', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('ticketId')));
    language: text/javascript
order: 11000
