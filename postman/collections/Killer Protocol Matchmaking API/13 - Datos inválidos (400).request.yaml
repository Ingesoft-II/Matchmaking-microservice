$kind: http-request
url: "{{baseUrl}}/api/matchmaking/tickets/arcade"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{casualToken}}
body:
  type: text
  content: |-
    {
      "playerIds": [],
      "region": "sa-east",
      "latencyMs": -1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('datos inválidos: 400', () => pm.response.to.have.status(400));
      pm.test('error JSON', () => pm.expect(pm.response.json().error).to.be.a('string'));
    language: text/javascript
order: 13000
