$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "playerId": "{{moderatorPlayer}}",
      "email": "{{moderatorEmail}}",
      "password": "{{password}}",
      "role": "MODERADOR"
    }
scripts:
  - type: afterResponse
    code: "pm.test('registro MODERADOR: 201', () => pm.response.to.have.status(201));"
    language: text/javascript
order: 4000
