server:
  port: ${PORT:8082}
  error:
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: matchmaking-service

springdoc:
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true

matchmaking:
  cycle-delay-ms: 2000
  max-wait-sec:
    ranked: 300
    arcade: 120
  region-default: sa-east
  maps:
    ranked: ["Bunker", "Refinery", "Terminal"]
    arcade: ["Arena", "Docks"]
  rating:
    default: 1000
    cache-ttl-sec: 60
  policy:
    ranked:
      base-gap: 100
      growth-per-sec: 2.0   # |Δrating| <= 100 + 2·espera
    arcade:
      max-latency-ms: 120
  partida-ttl-hours: 3

progress:
  base-url: http://localhost:9091
  connect-timeout-ms: 500
  read-timeout-ms: 1500

orchestrator:
  base-url: http://localhost:9092
  connect-timeout-ms: 500
  read-timeout-ms: 1500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

security:
  jwt:
    secret: ${JWT_SECRET:killer-protocol-default-jwt-secret-key-2026-min-32-bytes}
    expiration-sec: ${JWT_EXPIRATION_SEC:900}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:3000,http://localhost:5173,https://client.killerprotocol.com}

storage:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:6379}
  username: ${DB_USER:killerprotocol}
  password: ${DB_PASSWORD:}
